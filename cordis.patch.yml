- insert:
    - id: dsh-soul-memory
      name: dsh-soul-memory
      inject: [tools, systemPrompt, commands]
      config:
        # 演化（自改 harness）默认关闭；记忆层默认开启。
        enabled: false
        provider: ''
        model: ''
        memory:
          enabled: true
          projectionBytes: 600
          maintenance: true
        coding:
          enabled: true
          budget: 2000
        lessons:
          enabled: true
          budget: 600
        bridge:
          enabled: true
          sessionsDir: ''
          maxSessions: 4
          maxChars: 1200
